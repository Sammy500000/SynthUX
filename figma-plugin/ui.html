<style>
  body {
    font-family: sans-serif;
    padding: 1rem;
  }
  textarea {
    width: 100%;
    height: 200px;
  }
</style>

<button id="run-test">Run Test</button>
<textarea id="results"></textarea>

<script>
  document.getElementById('run-test').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'run-test' } }, '*');
  };

  window.onmessage = (event) => {
    if (event.data.pluginMessage) {
      document.getElementById('results').value = JSON.stringify(event.data.pluginMessage, null, 2);
    }
  };
</script>
